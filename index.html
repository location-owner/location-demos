<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f8" />
    <title>小天才作战地图 · 五层经营诊断</title>
    <style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-soft: #f7f9fc;
  --line: #e3e8ef;
  --line-strong: #d2dae4;
  --text: #16202d;
  --muted: #718096;
  --blue: #2563eb;
  --blue-soft: #eaf1ff;
  --orange: #f97316;
  --orange-soft: #fff1e8;
  --red: #dc3f3f;
  --red-soft: #fff0f0;
  --green: #159c70;
  --green-soft: #e9f8f2;
  --shadow: 0 1px 2px rgba(25, 45, 75, 0.035), 0 8px 20px rgba(25, 45, 75, 0.045);
  --radius: 12px;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select { font: inherit; }
button { cursor: pointer; transition-property: color, background-color, border-color, box-shadow, opacity, transform; transition-duration: 150ms; transition-timing-function: cubic-bezier(.2, 0, 0, 1); }
button:not(.map-hotspot):active { transform: scale(.96); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.24); outline-offset: 2px; }

.app-shell { min-height: 100vh; }
.topbar {
  height: 68px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
}
.brand-block, .topbar-right, .controls, .breadcrumb, .hero-row, .panel-head, .map-footer, .ai-panel, .ai-label, .ai-main, .ai-action { display: flex; align-items: center; }
.brand-block { gap: 11px; }
.brand-mark { width: 30px; height: 30px; background: var(--orange); border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding: 7px; }
.brand-mark span { width: 4px; background: #fff; border-radius: 2px 2px 1px 1px; }
.brand-mark span:nth-child(1) { height: 8px; opacity: .7; }
.brand-mark span:nth-child(2) { height: 13px; }
.brand-mark span:nth-child(3) { height: 10px; opacity: .86; }
.brand-title { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.brand-subtitle { color: var(--muted); font-size: 11px; margin-top: 1px; }
.topbar-right { gap: 16px; color: var(--muted); font-size: 12px; }
.demo-badge { color: #8b5b16; background: #fff7df; border: 1px solid #f5e3b2; padding: 3px 8px; border-radius: 99px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #cfe0ff; background: var(--blue-soft); color: var(--blue); font-size: 11px; }

.controlbar { min-height: 60px; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.breadcrumb { gap: 6px; min-width: 0; overflow-x: auto; white-space: nowrap; }
.crumb { border: 0; background: transparent; color: var(--muted); padding: 5px 3px; }
.crumb.current { color: var(--text); font-weight: 600; }
.crumb:not(.current):hover { color: var(--blue); }
.crumb-sep { color: #aeb8c5; }
.controls { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.select-control, .search-control { height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; display: flex; align-items: center; }
.select-control { padding: 0 9px; gap: 7px; }
.select-control span { color: var(--muted); font-size: 11px; }
.select-control select { border: 0; outline: 0; background: transparent; color: var(--text); }
.brand-filter { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; padding: 2px; background: #fff; }
.filter-btn { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
.filter-btn.active { color: var(--blue); background: var(--blue-soft); font-weight: 600; }
.search-control { width: 150px; padding: 0 9px; gap: 7px; }
.search-control input { width: 100%; border: 0; outline: 0; color: var(--text); background: transparent; }
.search-control input::placeholder { color: #a2adbb; }
.search-icon { width: 12px; height: 12px; border: 1.5px solid #93a2b5; border-radius: 50%; position: relative; flex: 0 0 auto; }
.search-icon::after { content: ""; position: absolute; width: 5px; height: 1.5px; background: #93a2b5; right: -4px; bottom: -2px; transform: rotate(45deg); border-radius: 2px; }
.ghost-btn, .primary-btn, .text-btn { border: 0; border-radius: 7px; height: 34px; padding: 0 11px; }
.ghost-btn { background: var(--surface-soft); color: var(--muted); border: 1px solid var(--line); }
.ghost-btn:hover { color: var(--blue); border-color: #b8cdf8; }
.primary-btn { background: var(--blue); color: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(16,64,145,.16), 0 4px 10px rgba(37,99,235,.15); }
.primary-btn:hover { background: #1d4ed8; box-shadow: 0 2px 4px rgba(16,64,145,.17), 0 6px 14px rgba(37,99,235,.18); }
.play-icon { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid #fff; display: inline-block; margin-right: 6px; transform: translateY(.5px); }

.page-content { max-width: 1880px; margin: 0 auto; padding: 24px 30px 34px; }
.hero-row { justify-content: space-between; margin-bottom: 18px; }
.eyebrow { color: var(--blue); font-size: 12px; font-weight: 600; letter-spacing: .08em; }
h1, h2, p { margin: 0; }
h1 { font-size: 26px; line-height: 1.25; margin-top: 4px; letter-spacing: -.02em; text-wrap: balance; }
.hero-row p { color: var(--muted); margin-top: 7px; text-wrap: pretty; }
.hero-status { display: flex; gap: 9px; align-items: center; }
.status-chip { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.status-chip strong { color: var(--text); margin-right: 4px; }
.status-chip.danger { background: var(--red-soft); border-color: #f3cdcd; color: var(--red); }

.metric-grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.metric-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 17px; min-height: 126px; box-shadow: var(--shadow); }
.metric-card.brand-card { position: relative; overflow: hidden; }
.metric-card.brand-card { grid-column: span 2; }
.metric-card.brand-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--brand-color); }
.metric-card-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
.brand-name { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 600; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-color); }
.metric-big { font-size: 28px; font-weight: 700; letter-spacing: -.04em; margin-top: 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric-big.negative { color: var(--red); }
.metric-sub { color: var(--muted); margin-top: 3px; font-size: 11px; }
.metric-card .metric-bar { height: 5px; background: #eef2f7; border-radius: 99px; margin-top: 10px; overflow: hidden; }
.metric-card .metric-bar i { display: block; height: 100%; border-radius: 99px; background: var(--brand-color, var(--blue)); }
.metric-card.extra .metric-big { color: var(--blue); }
.metric-card.extra.warning .metric-big { color: var(--red); }
.compare-card { min-width: 0; padding-left: 10px; padding-right: 10px; }
.compare-card .metric-card-head { margin-bottom: 12px; gap: 5px; min-width: 0; }
.compare-card .metric-card-head span:first-child { white-space: nowrap; }
.compare-card .metric-card-head span:last-child { text-align: right; line-height: 1.25; }
.compare-values { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare-value { min-width: 0; }
.compare-value b { display: block; font-size: clamp(17px, 1.3vw, 20px); letter-spacing: -.04em; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.compare-value b.orange { color: var(--orange); }
.compare-value b.blue { color: var(--blue); }
.compare-value span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
.compare-value .mini-bar { height: 4px; margin-top: 7px; border-radius: 99px; background: #edf1f5; overflow: hidden; }
.compare-value .mini-bar i { display: block; height: 100%; border-radius: 99px; }
.compare-value .mini-bar i.orange { background: var(--orange); }
.compare-value .mini-bar i.blue { background: var(--blue); }

.workspace-grid { display: grid; grid-template-columns: minmax(0, 1.17fr) minmax(470px, .83fr); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.map-panel { overflow: hidden; }
.panel-head { justify-content: space-between; gap: 10px; padding: 17px 18px 12px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 15px; font-weight: 700; }
.panel-head p { color: var(--muted); font-size: 11px; margin-top: 3px; }
.map-legend { display: flex; gap: 12px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend-dot.critical { background: var(--red); }
.legend-dot.watch { background: #f1a22c; }
.legend-dot.stable { background: var(--green); }
.map-stage { height: 490px; background: #edf1f0; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
.map-stage:active, .map-stage.panning { cursor: grabbing; }
.map-stage::before { content: ""; position: absolute; inset: 0; opacity: .28; background-image: linear-gradient(rgba(117,139,163,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(117,139,163,.05) 1px, transparent 1px); background-size: 52px 52px; pointer-events: none; }
.map-stage svg { width: 100%; height: 100%; display: block; position: relative; z-index: 1; }
.map-canvas { position: absolute; inset: 0; }
.map-canvas::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 67%, rgba(110,132,155,.08) 100%); }
.map-screen-canvas { overflow: hidden; }
.map-image-viewport { position: absolute; inset: 0; transform-origin: center; transition: transform .14s ease-out; will-change: transform; contain: layout paint; }
.map-stage.panning .map-image-viewport { transition: none; }
.map-image-viewport > img { width: 100%; height: 100%; object-fit: cover; object-position: var(--map-position, center); display: block; pointer-events: none; user-select: none; outline: 1px solid oklch(0 0 0 / 0.1); outline-offset: -1px; }
.map-hotspot { position: absolute; z-index: 2; border: 0; border-radius: 8px; background: transparent; color: transparent; padding: 0; cursor: pointer; transform: none; filter: none; }
.map-hotspot.risk-focus { z-index: 4; }
.map-hotspot:hover, .map-hotspot:focus-visible { background: rgba(37,99,235,.08); box-shadow: inset 0 0 0 2px rgba(37,99,235,.75), 0 0 0 3px rgba(255,255,255,.45); outline: 0; }
.map-hotspot span { position: absolute; left: 50%; top: -27px; transform: translateX(-50%); padding: 4px 7px; white-space: nowrap; border-radius: 5px; background: rgba(20,35,54,.92); color: #fff; font-size: 10px; line-height: 1.2; opacity: 0; pointer-events: none; transition: opacity .15s; }
.map-hotspot:hover span, .map-hotspot:focus-visible span { opacity: 1; }
.map-tools { position: absolute; right: 14px; top: 14px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.map-tool-btn, .map-zoom-btn { width: 34px; height: 34px; border: 1px solid rgba(183,198,214,.95); background: rgba(255,255,255,.92); color: #5b6d83; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(41,59,83,.08), 0 3px 8px rgba(41,59,83,.07); font-size: 15px; position: relative; }
.map-tool-btn::before, .map-zoom-btn::before { content: ""; position: absolute; inset: -3px; }
.map-tool-btn:hover, .map-zoom-btn:hover { color: var(--blue); border-color: #a9c3f7; background: #fff; }
.map-tool-btn.active { color: var(--blue); background: var(--blue-soft); border-color: #bfd1f8; }
.tool-layers { width: 14px; height: 11px; border: 1.5px solid currentColor; border-radius: 2px; position: relative; transform: translateY(-.25px); }
.tool-layers::before, .tool-layers::after { content: ""; position: absolute; left: 2px; right: 2px; height: 1px; background: currentColor; }
.tool-layers::before { top: 3px; }.tool-layers::after { top: 6px; }
.tool-target { width: 14px; height: 14px; border: 1.5px solid currentColor; border-radius: 50%; position: relative; transform: translateY(-.25px); }
.tool-target::after { content: ""; position: absolute; inset: 3px; border: 1.5px solid currentColor; border-radius: 50%; }
.map-zoom { position: absolute; right: 14px; bottom: 14px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
.map-layer-chip { position: absolute; left: 14px; top: 14px; z-index: 5; color: #64758a; font-size: 10px; background: rgba(255,255,255,.86); border: 1px solid rgba(183,198,214,.8); border-radius: 5px; padding: 5px 7px; }
.map-brand-legend { position: absolute; left: 14px; bottom: 14px; z-index: 5; display: flex; gap: 9px; align-items: center; color: #5d7088; font-size: 10px; background: rgba(255,255,255,.88); border: 1px solid rgba(183,198,214,.78); border-radius: 5px; padding: 5px 7px; }
.map-brand-legend span { display: inline-flex; align-items: center; gap: 4px; }
.map-store-swatch, .map-poi-swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(64,82,105,.15); }
.map-store-swatch { background: #f97316; }
.map-poi-swatch { background: #3b82f6; }
.map-grid-roads path { fill: none; stroke: #fff; stroke-width: 2.1; opacity: .94; stroke-linecap: round; }
.map-grid-roads path:nth-child(2) { stroke-width: 3.5; }
.map-minor-roads path { fill: none; stroke: rgba(255,255,255,.62); stroke-width: 1.1; stroke-linecap: round; }
.map-water { fill: #cbd7d9; }
.map-river { fill: none; stroke: #c9d7d9; stroke-width: 26; opacity: .9; }
.map-river.tributary { stroke-width: 11; opacity: .72; }
.base-city circle { fill: #ff4d4f; stroke: #fff; stroke-width: 1; }
.base-city text { fill: #4d555f; font-size: 11px; font-weight: 500; }
.country-outline { fill: rgba(224,240,243,.46); stroke: #d7e1e5; stroke-width: 2; stroke-linejoin: round; pointer-events: none; }
.island-outline { fill: rgba(224,240,243,.46); stroke: #d7e1e5; stroke-width: 1.4; }
.country-border { fill: none; stroke: #91a9b6; stroke-width: 2.2; stroke-linejoin: round; pointer-events: none; }
.island-outline.filled { fill: #aee7c8; stroke: #fff; stroke-width: 1.8; }
.city-outline { fill: rgba(217,235,245,.32); stroke: #1762d3; stroke-width: 2.5; stroke-linejoin: round; }
.generation-outline { fill: rgba(180,235,202,.2); stroke: #8ac9a5; stroke-width: 2.2; }
.district-outline { fill: rgba(217,235,245,.34); }
.business-outline { fill: rgba(247,196,220,.23); }
.context-region { opacity: .82; pointer-events: none; }
.system-boundary { stroke-linejoin: round; transition: filter .16s, opacity .16s; }
.generation-boundary { stroke: #fff; stroke-width: 2.4; }
.system-value-label rect { fill: #3f8fff; filter: drop-shadow(0 2px 3px rgba(20,70,140,.16)); }
.system-value-label text { fill: #fff; font-size: 11px; }
.system-name-label rect { fill: rgba(255,255,255,.94); stroke: #d4dae2; stroke-width: 1; filter: drop-shadow(0 2px 3px rgba(25,45,75,.08)); }
.system-name-label text { fill: #333d4a; font-size: 11px; font-weight: 600; }
.cluster-marker text { fill: #fff; font-size: 9px; font-weight: 700; pointer-events: none; }
.brand-cluster { fill: #ff970f; stroke: #fff; stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(255,125,0,.35)); }
.count-cluster { fill: #4388f5; stroke: #fff; stroke-width: 2; }
.cluster-marker .count-text { font-size: 8px; }
.map-poi { fill: #3b82f6; stroke: #fff; stroke-width: 2; }
.map-store { fill: #f97316; stroke: #fff; stroke-width: 2; }
.map-marker-label { pointer-events: none; font-size: 9px; fill: #3c5c80; }
.map-region { cursor: pointer; transition: filter .18s, opacity .18s, transform .18s; transform-box: fill-box; transform-origin: center; }
.map-region:hover { filter: saturate(1.12) brightness(1.02); transform: scale(1.008); }
.map-hotspot.map-region:hover { filter: none; transform: none; }
.map-region.selected .system-boundary { stroke: #0f5ed7; stroke-width: 3.2; }
.map-region.dimmed { opacity: .35; }
.map-label { pointer-events: none; font-size: 14px; font-weight: 600; fill: #243449; }
.map-label-sub { pointer-events: none; font-size: 11px; fill: #60738c; }
.map-pulse { animation: pulse 2.3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.mall-marker .brand-cluster { filter: drop-shadow(0 2px 6px rgba(255,125,0,.42)); }
.mall-name text { font-size: 10px; }
@keyframes pulse { 0%, 100% { opacity: .95; r: 7; } 50% { opacity: .45; r: 11; } }
.map-footer { justify-content: space-between; padding: 10px 16px 12px; color: var(--muted); font-size: 11px; }
.map-note { text-align: right; }

.ranking-panel { min-height: 557px; display: flex; flex-direction: column; }
.text-btn { color: var(--blue); background: transparent; padding: 0 3px; height: 28px; }
.ranking-table-wrap { overflow: auto; flex: 1; }
.ranking-table { width: 100%; border-collapse: collapse; min-width: 620px; }
.ranking-table th { position: sticky; top: 0; z-index: 2; background: #fbfcfe; color: var(--muted); font-size: 11px; text-align: left; font-weight: 500; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ranking-table td { padding: 10px; border-bottom: 1px solid #edf0f4; vertical-align: middle; white-space: nowrap; }
.ranking-row { cursor: pointer; transition: background .15s; }
.ranking-row:hover td { background: #f7faff; }
.ranking-row.current td { background: #f0f5ff; }
.object-cell { display: flex; align-items: center; gap: 8px; min-width: 148px; }
.rank-index { width: 20px; color: #9aa8b8; font-size: 11px; }
.object-name { font-weight: 600; color: var(--text); }
.object-meta { color: var(--muted); font-size: 10px; margin-top: 2px; }
.risk-cell { min-width: 86px; }
.risk-score { font-weight: 700; }
.risk-score.high { color: var(--red); }
.risk-score.mid { color: #c77b15; }
.risk-score.low { color: var(--green); }
.risk-bar { height: 4px; width: 66px; background: #edf1f5; border-radius: 99px; margin-top: 4px; overflow: hidden; }
.risk-bar i { display: block; height: 100%; border-radius: 99px; }
.risk-bar i.high { background: var(--red); }
.risk-bar i.mid { background: #efad3a; }
.risk-bar i.low { background: var(--green); }
.brand-rate { font-weight: 700; }
.brand-rate.xiaotiancai { color: var(--orange); }
.brand-rate.bbk { color: var(--blue); }
.status-pill { display: inline-flex; padding: 3px 7px; border-radius: 5px; font-size: 10px; }
.status-pill.high { color: var(--red); background: var(--red-soft); }
.status-pill.mid { color: #a9680f; background: #fff6df; }
.status-pill.low { color: var(--green); background: var(--green-soft); }
.detail-btn { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 5px; padding: 4px 7px; font-size: 11px; }
.detail-btn:hover { border-color: #b6caf4; color: var(--blue); }
.empty-state { text-align: center; color: var(--muted); padding: 50px 20px; }

.ai-panel { margin-top: 14px; min-height: 110px; background: #111c2b; border-radius: var(--radius); color: #e9f0fa; padding: 15px 18px; gap: 20px; box-shadow: 0 14px 30px rgba(17,28,43,.16); }
.ai-label { gap: 10px; width: 152px; flex: 0 0 auto; border-right: 1px solid rgba(220,232,247,.16); padding-right: 16px; }
.ai-orb { width: 30px; height: 30px; border-radius: 9px; background: #4f74d9; position: relative; box-shadow: 0 0 0 5px rgba(105,133,255,.1); }
.ai-orb::before, .ai-orb::after { content: ""; position: absolute; background: #fff; opacity: .9; border-radius: 99px; }
.ai-orb::before { width: 12px; height: 3px; left: 9px; top: 10px; }
.ai-orb::after { width: 8px; height: 3px; left: 9px; top: 16px; }
.ai-title { font-weight: 700; font-size: 14px; }
.ai-caption { color: #91a5bc; font-size: 10px; margin-top: 2px; }
.ai-main { align-items: flex-start; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.ai-conclusion { font-size: 14px; line-height: 1.5; font-weight: 600; text-wrap: pretty; }
.ai-conclusion strong { color: #ffb17a; }
.ai-evidence { display: flex; gap: 7px; flex-wrap: wrap; }
.evidence-chip { color: #b9c9dc; background: rgba(255,255,255,.08); border: 1px solid rgba(220,232,247,.13); padding: 4px 7px; border-radius: 5px; font-size: 11px; }
.evidence-chip b { color: #fff; }
.ai-action { flex: 0 0 auto; border-left: 1px solid rgba(220,232,247,.16); padding-left: 18px; max-width: 270px; align-self: stretch; }

  const q = state.search.trim().toLowerCase();

}
function activeMetric(n, brand) {
  const raw = n.metrics[brand];
  const factor = state.period === "2025" ? 0.91 : 1;
  const actual = raw.actual * factor;
  const forecast = raw.forecast * factor;
  const yoy = raw.yoy + (state.period === "2025" ? -1.8 : 0);
  const penetration = raw.penetration ?? raw.coverage * .82;
  const online = raw.online ?? raw.coverage * .68;
  return { ...raw, actual, forecast, yoy, penetration, online, achieve: actual / raw.target * 100, gap: forecast - raw.target };

function riskParts(n, brand = "all") {
  const m = brand === "all" ? { target: avgMetric(n, "target"), actual: avgMetric(n, "actual"), forecast: avgMetric(n, "forecast"), yoy: avgMetric(n, "yoy"), coverage: avgMetric(n, "coverage") } : activeMetric(n, brand);
  const completion = clamp((1 - m.actual / m.target) * 100);
  const yoy = clamp(-m.yoy * 4);
  const forecast = clamp((m.target - m.forecast) / m.target * 100);
  const coverage = clamp(100 - m.coverage);

function renderMap() {
  const n = currentNode();
  const children = n.level === "business" ? [n] : currentChildren();
  const titleMap = { national: "全国风险分布", generation: `${n.name} · 城市分布`, city: `${n.name} · 片区分布`, district: `${n.name} · 商圈分布`, business: `${n.name} · 经营点位` };
  document.getElementById("mapTitle").textContent = titleMap[n.level];
  document.getElementById("mapHint").textContent = n.level === "business" ? "当前为最细层级，点击地图区域可打开右侧详情抽屉" : "线上系统截图底图 · 点击地图区域进入下一层级";
  document.getElementById("mapCount").textContent = n.level === "business" ? "已到达诊断末端" : `${children.length} 个${n.level === 'national' ? '一代' : n.level === 'generation' ? '城市' : n.level === 'city' ? '片区' : '商圈'}单元`;
  document.querySelector(".map-note").textContent = "底图为线上系统截图 · 透明热区支持下钻";
  const focusId = maxRiskChild()?.id;
  const hotspots = children.map(child => {
    const spot = mapHotspots[n.level]?.[child.id] || { x: 25, y: 20, w: 50, h: 60 };
    const score = riskParts(child, state.brand).score;
    const focused = child.id === focusId || state.path.includes(child.id);
    return `<button type="button" class="map-hotspot map-region ${focused ? 'risk-focus' : ''}" data-id="${child.id}" style="left:${spot.x}%;top:${spot.y}%;width:${spot.w}%;height:${spot.h}%" aria-label="${child.name}，风险 ${score} 分"><span>${child.name} · 风险 ${score}</span></button>`;
  }).join("");
  const asset = mapScreenAssets[n.level];
  document.getElementById("mapStage").innerHTML = `<div class="map-canvas map-screen-canvas"><div class="map-image-viewport" id="mapViewport" style="transform:translate(${state.mapX}px, ${state.mapY}px) scale(${state.mapZoom});--map-position:${mapScreenPosition[n.level]}"><img src="${asset}" alt="${titleMap[n.level]}系统地图截图" loading="eager" decoding="async" draggable="false"/>${hotspots}</div></div><div class="map-tools"><button type="button" class="map-tool-btn active" aria-label="系统地图截图" title="系统地图截图"><span class="tool-layers"></span></button><button type="button" class="map-tool-btn" aria-label="定位当前风险对象" title="定位当前风险对象"><span class="tool-target"></span></button></div><div class="map-zoom"><button type="button" class="map-zoom-btn" data-map-zoom="in" aria-label="放大地图">+</button><button type="button" class="map-zoom-btn" data-map-zoom="out" aria-label="缩小地图">−</button><button type="button" class="map-zoom-btn" data-map-zoom="reset" aria-label="重置地图视图">0</button></div>`;
  document.querySelectorAll(".map-region").forEach(el => { const activate = () => n.level === "business" ? openDrawer(el.dataset.id) : handleNodeClick(el.dataset.id); el.addEventListener("click", activate); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } }); });
  document.querySelectorAll("[data-map-zoom]").forEach(btn => btn.addEventListener("click", () => {
    const action = btn.dataset.mapZoom;
    if (action === "in") state.mapZoom = Math.min(1.55, state.mapZoom + .12);
    if (action === "out") state.mapZoom = Math.max(.78, state.mapZoom - .12);
    if (action === "reset") resetMapView();
    applyMapTransform();
  }));
  document.querySelector(".map-tool-btn:nth-child(2)")?.addEventListener("click", () => { state.mapZoom = 1.12; state.mapX = 0; state.mapY = 0; applyMapTransform(); showToast("已定位当前诊断对象"); });
  let wheelDelta = 0;
  let wheelFrame = 0;
  document.getElementById("mapStage").addEventListener("wheel", e => {
    e.preventDefault();
    wheelDelta += e.deltaY < 0 ? .06 : -.06;
    if (wheelFrame) return;
    wheelFrame = requestAnimationFrame(() => {
      state.mapZoom = Math.max(.78, Math.min(1.55, state.mapZoom + wheelDelta));
      wheelDelta = 0;
      wheelFrame = 0;
      applyMapTransform();
    });
  }, { passive: false });
  bindMapPan();
}

function resetMapView() { state.mapZoom = 1; state.mapX = 0; state.mapY = 0; }
function applyMapTransform() {
  const viewport = document.getElementById("mapViewport");
  if (viewport) viewport.style.transform = `translate(${state.mapX}px, ${state.mapY}px) scale(${state.mapZoom})`;
}
function bindMapPan() {
  const stage = document.getElementById("mapStage");
  const viewport = document.getElementById("mapViewport");
  let drag = null;
  stage.addEventListener("pointerdown", e => {
    if (e.target.closest("button, .map-region")) return;
    drag = { x: e.clientX, y: e.clientY, startX: state.mapX, startY: state.mapY };
    stage.classList.add("panning");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return;
    state.mapX = clamp(drag.startX + e.clientX - drag.x, -220, 220);
    state.mapY = clamp(drag.startY + e.clientY - drag.y, -140, 140);
    applyMapTransform();
  });
  const endDrag = () => { drag = null; stage.classList.remove("panning"); };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
}

function renderRanking() {
  const n = currentNode(); const children = (n.level === "business" ? [n] : currentChildren()).sort((a,b) => state.sortAsc ? riskParts(a, state.brand).score - riskParts(b, state.brand).score : riskParts(b, state.brand).score - riskParts(a, state.brand).score);
  const focusId = maxRiskChild()?.id;
  const labelMap = { national: "一代风险排名", generation: "城市风险排名", city: "片区风险排名", district: "商圈风险排名", business: "商圈经营明细" };
  document.getElementById("rankingTitle").textContent = labelMap[n.level];
  document.getElementById("rankingHint").textContent = n.level === "business" ? "当前对象指标详情" : `综合风险分 · ${state.sortAsc ? '低风险优先' : '高风险优先'}`;
  document.getElementById("sortBtn").textContent = state.sortAsc ? "切换高风险优先" : "按风险排序";
  const body = document.getElementById("rankingBody"); const empty = document.getElementById("emptyState");
  empty.hidden = children.length > 0;
  body.innerHTML = children.map((c, i) => { const score = riskParts(c, state.brand).score; const level = riskLevel(score); return `<tr class="ranking-row ${state.path.includes(c.id) || c.id === focusId ? 'current' : ''}" data-id="${c.id}" tabindex="0" aria-label="${c.name}，风险 ${score} 分">
    <td><div class="object-cell"><span class="rank-index">${String(i+1).padStart(2,'0')}</span><div><div class="object-name">${c.name}</div><div class="object-meta">${c.level === 'generation' ? '责任一代' : c.level === 'city' ? '城市单元' : c.level === 'district' ? '责任片区' : '核心商圈'}</div></div></div></td>
    <td class="risk-cell"><div class="risk-score ${level}">${score}</div><div class="risk-bar"><i class="${level}" style="width:${score}%"></i></div></td>
    <td class="brand-rate xiaotiancai">${displayRate(c,'xiaotiancai')}</td><td class="brand-rate bbk">${displayRate(c,'bbk')}</td>
    <td><span class="status-pill ${level}">${statusText(score)}</span></td>
    <td><button type="button" class="detail-btn" data-detail="${c.id}">详情</button></td>
  </tr>`; }).join("");
  body.querySelectorAll(".ranking-row").forEach(row => { const activate = e => { if (e?.target?.closest("[data-detail]")) return; n.level === "business" ? openDrawer(row.dataset.id) : handleNodeClick(row.dataset.id); }; row.addEventListener("click", activate); row.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.target.closest("[data-detail]")) { e.preventDefault(); activate(e); } }); });
  body.querySelectorAll("[data-detail]").forEach(btn => btn.addEventListener("click", e => { e.stopPropagation(); openDrawer(btn.dataset.detail); }));
}

function renderAi() {
  const n = currentNode(); const child = maxRiskChild(); const parts = riskParts(child || n, state.brand); const culprit = culpritBrand(child || n); const cm = activeMetric(child || n, culprit);
  const levelWord = { national: "一代", generation: "城市", city: "片区", district: "商圈", business: "经营对象" }[n.level];
  const subject = child ? child.name : n.name;
  document.getElementById("aiConclusion").innerHTML = child ? `建议优先关注 <strong>${subject}</strong>：综合风险 ${parts.score} 分，${brandMeta[culprit].label}完成率 ${pct(cm.achieve)}，是当前${levelWord}层级的首要问题对象。` : `<strong>${n.name}</strong> 已是最细诊断层级，可根据下方证据安排动作。`;
  document.getElementById("aiEvidence").innerHTML = child ? `<span class="evidence-chip">完成率缺口 <b>${parts.completion.toFixed(0)} 分</b></span><span class="evidence-chip">负向同比 <b>${parts.yoy.toFixed(0)} 分</b></span><span class="evidence-chip">预测缺口 <b>${cm.gap >= 0 ? '+' : ''}${fmt(cm.gap)} 台</b></span><span class="evidence-chip">商圈覆盖 <b>${pct(cm.coverage)}</b></span>` : `<span class="evidence-chip">目标达成 <b>${pct(activeMetric(n, culprit).achieve)}</b></span><span class="evidence-chip">预测缺口 <b>${activeMetric(n, culprit).gap >= 0 ? '+' : ''}${fmt(activeMetric(n, culprit).gap)} 台</b></span>`;
  document.getElementById("aiAction").innerHTML = `<div class="ai-action-text"><b>建议动作</b>${child ? (child.action || `进入${subject}详情，优先处理风险最高的品牌和点位。`) : (n.action || "打开详情抽屉查看经营证据。")}</div>`;
}

function render() { renderBreadcrumb(); renderHero(); renderMetrics(); renderMap(); renderRanking(); renderAi(); }

function handleNodeClick(id) {
  const n = index.get(id); if (!n) return;
  state.path = [...state.path, id]; state.search = ""; document.getElementById("searchInput").value = ""; state.guided = false; resetMapView(); render();
  showToast(n.level === "business" ? `已定位到 ${n.name}，可打开详情查看证据` : `已进入 ${n.name}`);
}
function openDrawer(id) {
  const n = index.get(id); if (!n) return;
  const x = activeMetric(n, "xiaotiancai"); const b = activeMetric(n, "bbk"); const parts = riskParts(n, state.brand); const culprit = culpritBrand(n); const culpritMetric = activeMetric(n, culprit);
  document.getElementById("drawerKicker").textContent = `${{generation:'一代',city:'城市',district:'责任片区',business:'商圈',national:'全国'}[n.level]} · 详情`;
  document.getElementById("drawerTitle").textContent = n.name;
  document.getElementById("drawerBody").innerHTML = `<section class="drawer-section"><div class="drawer-section-title">两品牌完成情况</div><div class="drawer-metric-grid"><div class="drawer-metric"><span>小天才目标达成</span><b class="orange">${pct(x.achieve)}</b></div><div class="drawer-metric"><span>步步高目标达成</span><b class="blue">${pct(b.achieve)}</b></div><div class="drawer-metric"><span>小天才销量同比</span><b class="${x.yoy < 0 ? 'red' : 'orange'}">${signedPct(x.yoy)}</b></div><div class="drawer-metric"><span>步步高销量同比</span><b class="${b.yoy < 0 ? 'red' : 'blue'}">${signedPct(b.yoy)}</b></div><div class="drawer-metric"><span>小天才预测缺口</span><b class="${x.gap < 0 ? 'red' : 'orange'}">${x.gap >= 0 ? '+' : ''}${fmt(x.gap)} 台</b></div><div class="drawer-metric"><span>步步高预测缺口</span><b class="${b.gap < 0 ? 'red' : 'blue'}">${b.gap >= 0 ? '+' : ''}${fmt(b.gap)} 台</b></div><div class="drawer-metric"><span>小天才商圈覆盖</span><b class="orange">${pct(x.coverage)}</b></div><div class="drawer-metric"><span>步步高商圈覆盖</span><b class="blue">${pct(b.coverage)}</b></div><div class="drawer-metric"><span>小天才渗透率</span><b class="orange">${pct(x.penetration)}</b></div><div class="drawer-metric"><span>步步高渗透率</span><b class="blue">${pct(b.penetration)}</b></div><div class="drawer-metric"><span>小天才线上占比</span><b class="orange">${pct(x.online)}</b></div><div class="drawer-metric"><span>步步高线上占比</span><b class="blue">${pct(b.online)}</b></div></div></section><section class="drawer-section"><div class="drawer-section-title">综合风险构成 · ${parts.score} 分</div><div class="risk-breakdown"><div class="break-row"><span>完成率缺口</span><div class="break-bar"><i style="width:${parts.completion}%"></i></div><b>${parts.completion.toFixed(0)}</b></div><div class="break-row"><span>负向同比</span><div class="break-bar"><i style="width:${parts.yoy}%"></i></div><b>${parts.yoy.toFixed(0)}</b></div><div class="break-row"><span>预测缺口</span><div class="break-bar"><i style="width:${parts.forecast}%"></i></div><b>${parts.forecast.toFixed(0)}</b></div><div class="break-row"><span>商圈覆盖缺口</span><div class="break-bar"><i style="width:${parts.coverage}%"></i></div><b>${parts.coverage.toFixed(0)}</b></div></div></section><section class="drawer-section"><div class="drawer-section-title">AI 诊断依据</div><ol class="evidence-list"><li>${brandMeta[culprit].label}完成率较低（${pct(culpritMetric.achieve)}），是主要拖累品牌。</li><li>预测年销量相对目标${culpritMetric.gap < 0 ? '仍有缺口' : '已有超额'} ${Math.abs(Math.round(culpritMetric.gap)).toLocaleString('zh-CN')} 台。</li><li>本品牌商圈覆盖率为 ${pct(culpritMetric.coverage)}，${culpritMetric.coverage < 50 ? '低于建议覆盖线，需要优先补缺。' : '具备继续放大的基础。'}</li></ol></section><section class="drawer-section"><div class="drawer-action"><b>建议动作</b>${n.action || `优先处理${n.name}的${brandMeta[culprit].label}经营缺口，完成后继续下钻复盘。`}</div></section>`;
  const drawer = document.getElementById("detailDrawer"); drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); document.getElementById("drawerClose").focus();
}
function closeDrawer() { const drawer = document.getElementById("detailDrawer"); drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); }
function showToast(message) { const toast = document.getElementById("toast"); toast.textContent = message; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200); }
function startGuide() {
  const target = maxRiskChild(); if (!target) return;
  if (currentNode().level === "business") { openDrawer(currentNode().id); showToast("当前已是最细层级，已打开经营证据"); return; }
  state.guided = true; state.path = [...state.path, target.id]; state.search = ""; document.getElementById("searchInput").value = ""; resetMapView(); render(); showToast(`诊断链路已定位：${target.name}`);
}

document.getElementById("resetBtn").addEventListener("click", () => { state.path = ["national"]; state.search = ""; state.guided = false; document.getElementById("searchInput").value = ""; resetMapView(); render(); });
document.getElementById("guideBtn").addEventListener("click", startGuide);
document.getElementById("sortBtn").addEventListener("click", () => { state.sortAsc = !state.sortAsc; renderRanking(); });
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
document.getElementById("searchInput").addEventListener("input", e => { state.search = e.target.value; renderMap(); renderRanking(); });
document.getElementById("periodSelect").addEventListener("change", e => { state.period = e.target.value; render(); showToast(`已切换至 ${e.target.value} 年 YTD（演示数据）`); });
document.querySelectorAll(".filter-btn").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll(".filter-btn").forEach(x => x.classList.toggle("active", x === btn)); state.brand = btn.dataset.brand; render(); }));

render();

</script>
  </body>
</html>
